name: Deploy to VPS

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Déploiement sur VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/mmi23c14/public_html/overload-back
            bash deploy.sh

      - name: ✅ Notification de succès
        if: success()
        run: echo "Déploiement réussi sur 45.155.171.55"

      - name: ❌ Notification d'échec
        if: failure()
        run: echo "Le déploiement a échoué"
