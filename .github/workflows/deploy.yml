name: Deploy to VPS

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          echo "📁 Déplacement vers le répertoire du projet..."
          cd /home/mmi23c07/public_html/overload-back

          echo "📥 Récupération des dernières modifications..."
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}

          echo "📦 Installation des dépendances Composer..."
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "🔧 Nettoyage du cache..."
          sudo rm -rf var/cache/prod/*

          echo "♻️ Recréation du cache..."
          sudo -u www-data php bin/console cache:clear --env=prod --no-interaction || php bin/console cache:clear --env=prod --no-interaction
          sudo -u www-data php bin/console cache:warmup --env=prod --no-interaction || php bin/console cache:warmup --env=prod --no-interaction

          echo "🗄️ Exécution des migrations..."
          sudo -u www-data php bin/console doctrine:migrations:migrate --no-interaction || php bin/console doctrine:migrations:migrate --no-interaction

          echo "🔐 Ajustement des permissions..."
          sudo chown -R www-data:www-data var/cache var/log
          sudo chmod -R 775 var/cache var/log

          echo "✅ Déploiement terminé avec succès!"
          echo "🕐 $(date '+%Y-%m-%d %H:%M:%S')"
